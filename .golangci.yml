version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell

formatters:
  enable:
    - gofmt
    - goimports

linters-settings:
  govet:
    enable-all: true

formatters-settings:
  gofmt:
    simplify: true

issues:
  exclude-use-default: false
